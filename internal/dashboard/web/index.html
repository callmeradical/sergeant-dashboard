<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sergeant | Fleet command</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="grain"></div>
  <header>
    <div>
      <p class="eyebrow">SERGEANT / OPERATIONS</p>
      <h1>Fleet command</h1>
    </div>
    <div class="live"><span></span> READ-ONLY</div>
  </header>
  <main>
    <section class="overview" aria-label="Fleet overview">
      <div><strong id="total">-</strong><span>workers</span></div>
      <div><strong id="active">-</strong><span>active</span></div>
      <div><strong id="attention">-</strong><span>attention</span></div>
      <p id="updated">Awaiting telemetry</p>
    </section>
    <section class="toolbar">
      <div>
        <h2>Deployment board</h2>
        <label class="search-label" for="search">Search summaries</label>
        <input id="search" type="search" autocomplete="off" placeholder="Project, task, status...">
      </div>
      <div class="filters" role="group" aria-label="Filter workers">
        <button class="selected" data-filter="all" type="button" aria-pressed="true">All</button>
        <button data-filter="active" type="button" aria-pressed="false">Active</button>
        <button data-filter="attention" type="button" aria-pressed="false">Attention</button>
      </div>
    </section>
    <div id="warnings" class="warnings" role="status" aria-live="polite" hidden></div>
    <section id="workers" class="workers" aria-live="polite">
      <p class="empty">Loading fleet state...</p>
    </section>
  </main>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-identity drawer-title" hidden>
    <div class="drawer-head">
      <div><p id="drawer-identity" class="eyebrow">WORKER DETAIL</p><h2 id="drawer-title">Operational context</h2></div>
      <button id="drawer-close" type="button" aria-label="Close dialog">Close</button>
    </div>
    <div id="drawer-content" class="drawer-content" aria-live="polite"></div>
    <footer class="drawer-footer"><span>Read-only inspection</span><span>Actions unavailable</span></footer>
  </aside>
  <footer>LOCAL TELEMETRY <span>NO COMMAND CHANNEL</span></footer>
  <script src="app.js"></script>
</body>
</html>
